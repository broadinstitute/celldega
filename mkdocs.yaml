site_name: Celldega Documentation

# Keep large/data artifacts out of the built site (and off the gh-pages branch).
# mkdocs copies everything under docs/ into site/ regardless of .gitignore,
# so notebook data dirs and large files must be excluded here.
exclude_docs: |
  examples/**/data/
  **/*.h5ad

theme:
  name: material
  favicon: assets/img/celldega_logo_32x32_transparent.png
  logo: assets/img/Celldega_LOGO_Two-Color_Transparent_Logo Mark.png
  # logo: assets/img/assets/img/celldega_logo_32x32_transparent.png
  features:
    - navigation.indexes

extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/broadinstitute/celldega"
    - icon: "fontawesome/brands/bluesky"
      link: "https://bsky.app/profile/stp-broad.bsky.social"

nav:
  - Home: index.md
  - Overview:
      - overview/index.md
      - Getting Started: overview/getting_started.md
      - Installation: overview/installation.md
      - File Formats: overview/file_formats.md
      - Row Group Storage: overview/row_groups.md
  - Visualizations:
      - visualizations/index.md
      - Landscape: visualizations/landscape.md
      - Yearbook: visualizations/yearbook.md
      - CellCloud: visualizations/cell-cloud.md
      - NeighborhoodCloud: visualizations/neighborhood-cloud.md
      - Clustergram: visualizations/clustergram.md
      - Composition: visualizations/composition.md
      - Enrich: visualizations/enrich.md
  - Python API:
      - python/index.md
      - align: python/align/api.md
      - clust: python/clust/api.md
      - collection: python/collection/api.md
      - dataset: python/dataset/api.md
      - nbhd: python/nbhd/api.md
      - pre: python/pre/api.md
      - select: python/select/api.md
      - set: python/set/api.md
      - viz: python/viz/api.md

  - JavaScript API:
      - javascript/index.md
      - API: javascript/api.md
  - Technologies:
      - technologies/index.md
  - Environments:
      - cloud_env/index.md
  - Gallery:
      - gallery/index.md
      - Imaging Spatial Transcriptomics:
          - Xenium:
              - Xenium Prime Mouse Brain: gallery/gallery_xenium_mouse_brain.md
              - Xenium Prime Human Skin: gallery/gallery_xenium_skin_cancer.md
          - Atera:
              - Atera Xenium Breast Cancer: gallery/gallery_atera.md
          - CosMx:
              - CosMx Human Colon CRC: gallery/gallery_cosmx_human_colon.md
      - Sequencing Spatial Transcriptomics:
          - Visium HD:
              - Visium HD Cell Segmentation Mouse Brain: gallery/gallery_visium_hd_cell_segmentation_mouse_brain.md
  - Example Notebooks:
    - examples/index.md
    - Tutorials:
      - Scanpy-Squidpy Xenium Pancreas: examples/tutorial_notebooks/Scanpy-Squidpy_Xenium_Pancreas.ipynb
      - Chromium Pre-process: examples/tutorial_notebooks/Scanpy_Chromium.ipynb
      - Single-cell Clustergram Chromium: examples/tutorial_notebooks/Single-Cell_Clustergram_Chromium.ipynb
      - Visium-HD Landscape Pre-process: examples/tutorial_notebooks/Visium-HD_Landscape_Pre-process.ipynb
    - Brief Notebooks:
      - Landscape View Xenium: examples/brief_notebooks/Landscape_View_Xenium.ipynb
      - CellCloud Thick MERFISH: examples/brief_notebooks/Landscape-3D_thick_MERFISH.ipynb
      - Landscape-Heatmap Visium-HD: examples/brief_notebooks/Landscape-Heatmap-Visium-HD.ipynb
      - UMAP-Cluster Pancreas Xenium: examples/brief_notebooks/UMAP-Cluster_Pancreas_Xenium.ipynb
      - Custom Segmentation: examples/brief_notebooks/Custom_Segmentation.ipynb
      - NeighborhoodCollection Population Space: examples/brief_notebooks/NeighborhoodCollection_Population_Space.ipynb
      - Gradient Neighborhood Pancreas Islets: examples/brief_notebooks/Gradient_Neighborhood_Pancreas_Islets.ipynb
      - DatasetCollection Population Space: examples/brief_notebooks/DatasetCollection_Population_Space.ipynb
      - SetCollection Cluster Space: examples/brief_notebooks/SetCollection_Cluster_Space.ipynb
      - Yearbook-Query: examples/brief_notebooks/Yearbook_Query.ipynb
      - Atera Viz: examples/brief_notebooks/Atera_viz.ipynb

markdown_extensions:
  - toc
  - tables
  - admonition
  - attr_list
  - md_in_html


plugins:
  - search
  - open-in-new-tab
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_toc_entry: true
            show_source: false
  - mkdocs-jupyter:
      include_source: true
      include_requirejs: true
      ignore: ["**/.ipynb_checkpoints/*.ipynb"]

extra_javascript:
  - path: assets/js/index.js
    type: module
  - path: assets/js/gallery_mouse_brain.js
    type: module
  - path: assets/js/gallery_skin_cancer.js
    type: module
  - path: assets/js/gallery_cosmx_colon.js
    type: module
  - path: assets/js/google-analytics.js
  - path: assets/js/hide_notebook_sidebar.js
    type: module
  - path: assets/js/gallery_visium_hd_cell_segmentation_mouse_brain.js
    type: module
  - path: assets/js/gallery_atera.js
    type: module

extra_css:
  - assets/css/custom.css
