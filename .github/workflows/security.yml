name: Security

on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set up Python for security scanning
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Disable jupyter-builder build hook for security scanning
      - name: Disable Jupyter builder for security scanning
        run: |
          sed -i 's/\[tool.hatch.build.hooks.\(.*\)\]/\[_tool.hatch.build.hooks.\1\]/' pyproject.toml

      # Install dependencies for security scanning
      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"

      # Python security scanning with Safety
      - name: Run Safety Check
        run: |
          pip install safety
          safety check --json --output safety-report.json || true

      # Python security scanning with Bandit
      - name: Run Bandit Security Scan
        run: |
          pip install bandit[toml]
          bandit -r src/ -f json -o bandit-report.json || true
