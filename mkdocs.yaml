      - Installation: getting-started/installation.md
      - Visualize Your Own Data: getting-started/your-data.md
      - From Scanpy & Squidpy: getting-started/from-scanpy.md
      - Usage: getting-started/usage/index.md
      - Desktop App: getting-started/desktop-app.md
      - Technologies: getting-started/technologies/index.md
      - File Formats: getting-started/file_formats.md
  - Visualizations:
      - visualizations/index.md
      - Landscape:
          - visualizations/landscape/index.md
          - UMAP and XY: visualizations/landscape/umap-xy.md
          - Neighborhoods: visualizations/landscape/neighborhoods.md
      - Yearbook: visualizations/yearbook.md
      - CellCloud: visualizations/cell-cloud.md
      - NeighborhoodCloud: visualizations/neighborhood-cloud.md
      - Clustergram: visualizations/clustergram.md
      - Composition: visualizations/composition.md
      - Enrich: visualizations/enrich.md
      - Landscape–Clustergram–Enrich: visualizations/landscape-clustergram-enrich.md
      - CellCloud–Clustergram: visualizations/cell-cloud-clustergram.md
  - Python API:
