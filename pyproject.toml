[build-system]
requires = [
    "hatchling>=1.26.1",
    "hatch-jupyter-builder>=0.5.0",
]
build-backend = "hatchling.build"

[project]
name = "celldega"
version = "0.16.0a1"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anndata>=0.12,<0.13",
    "scanpy[leiden]>=1.11,<1.12",
    "squidpy>=1.6,<1.7",
    "spatialdata>=0.2,<0.3",
    "spatialdata-io>=0.1,<0.2",
    "ome-zarr<0.10",
    "mudata",

    # xarray_schema still imports pkg_resources
    "setuptools<81",

    # Keep Zarr 2 because ome-zarr/spatialdata stack still expects FSStore
    "zarr>=2.18,<3",

    "numpy",
    "pandas>=2.2,<2.4",
    "scipy",
    "dask",
    "datashader",
    "polars>=1.10,<2",
    "pyarrow",
    "statsmodels>=0.14,<0.15",

    "igraph",
    "leidenalg",

    "geopandas",
    "libpysal",
    "shapely>=2.0,<2.2",
    "rasterio",
    "imagecodecs",
    "tifffile",

    "anywidget~=0.9.18",
    "ipywidgets>=8.0.0",
    "matplotlib",
    "requests",
    "watchfiles",
]

[project.optional-dependencies]
dev = [
    # Development environment / package workflow
    "hatch",
    "ipykernel",
    "jupyterlab>=4.0",
    "jupyterlab-widgets>=3.0.0",
    "ipywidgets>=8.0.0",

    # Linting & formatting
    "ruff",

    # Unit testing
    "pytest",
    "pytest-cov",
    "pytest-html",
    "pytest-mock",

    # Git hooks automation
    "pre-commit",

    # Package building / publishing
    "build",
    "twine",

    # Documentation
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocstrings[javascript]",
    "mkdocs-jupyter",
    "mkdocs-open-in-new-tab",
    "pymdown-extensions",
    "jupytext",
    "nbconvert",
    "nbformat",
]

# Optional dependencies for pre-processing
pre = [
    "pyvips~=2.2.2",
]

multimodal = [
    "muon==0.1.7",
]

# Automatically add the dev feature to the default env, e.g. hatch shell
[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.build]
only-packages = true
artifacts = ["src/celldega/static/*"]

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["src/celldega/static/celldega.js"]
skip-if-exists = ["src/celldega/static/celldega.js"]
dependencies = ["hatch-jupyter-builder>=0.5.0"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
npm = "npm"
build_cmd = "build"

# Ruff configuration
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".history",
    "notebooks",
    "js",
]

line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "I",
    "N",
    "UP",
    "C4",
    "SIM",
    "PIE",
    "Q",
    "RET",
    "PTH",
    "PERF",
    "RUF",
]

ignore = [
    "E501", # Line too long; handled by formatter
    "N806", # Variable in function should be lowercase; conflicts with scientific naming
    "N803", # Argument name should be lowercase; conflicts with scientific naming
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/*" = ["E402", "N802"]
"notebooks/*" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["celldega"]
known-third-party = [
    "anndata",
    "dask",
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "scanpy",
    "scipy",
    "seaborn",
    "shapely",
    "spatialdata",
    "squidpy",
    "zarr",
]
lines-after-imports = 2
force-single-line = false
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

# pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src/celldega",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "-v",
    "--tb=short",
]
minversion = "6.0"