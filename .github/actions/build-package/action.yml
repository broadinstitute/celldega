name: 'Build Package'
description: 'Builds JavaScript bundle and Python package for Celldega'

outputs:
  artifacts-path:
    description: 'Path to build artifacts'
    value: 'dist/'

runs:
  using: 'composite'
  steps:
    - name: Build JavaScript bundle
      shell: bash
      run: pnpm run build

    - name: Test Python package building (wheel + sdist)
      shell: bash
      run: |
        pip install build
        python -m build

    - name: Test package installation from built wheel
      shell: bash
      run: |
        pip install dist/*.whl
        python -c "import celldega; print('Package installed successfully')"
