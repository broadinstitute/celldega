markdown_extensions:
  - toc
  - tables
  - admonition
  - attr_list
  - md_in_html
  # Collapsible blocks, tabs, and keyboard keys (++s++) in the visualization guides.
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys


plugins:
  - search
  - open-in-new-tab
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            # Renders Sphinx roles (:func:`name`) in docstrings as inline code.
            extensions:
              - scripts/griffe_sphinx_roles.py:SphinxRoles
            show_root_toc_entry: true
            show_source: false
  - mkdocs-jupyter:
      include_source: true
      include_requirejs: true
      ignore: ["**/.ipynb_checkpoints/*.ipynb"]

