# =============================================================================
# Celldega CI/CD Pipeline
# Principal Engineering: Modular, maintainable, scalable
# =============================================================================
name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Prevent redundant runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions by default
permissions:
  contents: read

jobs:
  # =============================================================================
  # Quality Gate - Code quality and security checks
  # =============================================================================
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  # =============================================================================
  # Test Matrix - Comprehensive testing across environments
  # =============================================================================
  test-matrix:
    needs: quality-gate
    uses: ./.github/workflows/test-matrix.yml

  # =============================================================================
  # Release - Automated publishing (tags only)
  # =============================================================================
  release:
    needs: [quality-gate, test-matrix]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
