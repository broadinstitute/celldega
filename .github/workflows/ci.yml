name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install Python dependencies
        run: |
          pip install -e ".[dev]"
          
      - name: Install Node dependencies
        run: npm ci
        
      - name: Lint Python code
        run: ruff check src/
        
      - name: Check Python formatting
        run: ruff format --check src/
        
      - name: Lint JavaScript code
        run: npm run lint:js
        
      - name: Check JavaScript formatting
        run: npm run format:js:check

  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          
      - name: Run Python tests
        run: pytest --cov=src/celldega --cov-report=xml
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: python
          name: codecov-python

  test-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run JavaScript tests
        run: npm run test:js
        
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: javascript
          name: codecov-javascript

  build-and-test:
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-python, test-javascript]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          npm ci
          
      - name: Build JavaScript bundle
        run: npm run build
        
      - name: Test package build
        run: |
          pip install build
          python -m build
          
      - name: Test package installation
        run: |
          pip install dist/*.whl
          python -c "import celldega; print('Package installed successfully')"
