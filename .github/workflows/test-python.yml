name: Test Python

on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      # Setup environments using reusable actions
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-js-env

      # Run Python tests with coverage reporting
      - name: Run Python tests
        run: pytest --cov=src/celldega --cov-report=xml

      # Upload Python test coverage to Codecov (only for main Python version)
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: python
          name: codecov-python
          fail_ci_if_error: false
