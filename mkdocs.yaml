site_name: Celldega Documentation
repo_url: https://github.com/broadinstitute/celldega
repo_name: GitHub

# Keep large/data artifacts out of the built site (and off the gh-pages branch).
# mkdocs copies everything under docs/ into site/ regardless of .gitignore,
# so notebook data dirs and large files must be excluded here.
exclude_docs: |
  examples/**/data/
  **/*.h5ad
  # CCLE multi-omics tutorials temporarily hidden; remove these two lines and
  # uncomment their nav entries below to restore them.
  examples/ccle_multiomics.md
  examples/tutorial_notebooks/CCLE_Multiomics_*.ipynb
  # Flex CITE-seq tutorial temporarily hidden while it is revised; remove this
  # line and uncomment its nav entry below (and the entry in examples/index.md
  # and the link in gallery_citeseq_pbmc.md) to restore it.
  examples/tutorial_notebooks/Flex_CITE-seq_PBMC_Landscape-Clustergram-Enrich.ipynb
  # Older alignment drafts, superseded by the listed Broad-Allen tutorials.
  examples/tutorial_notebooks/1.0_Preprocess_and_Align.ipynb
  examples/tutorial_notebooks/2.0_Viz_CellCloud.ipynb

# Built and shareable by URL, but intentionally absent from the navigation.
# The hook also omits these pages from search/sitemap and adds noindex metadata.
not_in_nav: |
  examples/tutorial_notebooks/CST_Lung_Cancer_PTM_Clustergram-Enrich.ipynb
  examples/tutorial_notebooks/MIX-seq_Drug_Screen_Landscape-Clustergram-Enrich.ipynb
  examples/tutorial_notebooks/AIFI_Olink_Plasma_Proteomics_Clustergram-Enrich.ipynb
  # Companion to python/aligned_he.md; source: notebooks/Xenium_Aligned_HE.ipynb.
  examples/tutorial_notebooks/Xenium_Aligned_HE.ipynb

hooks:
  - scripts/unlisted_docs.py

theme:
  name: material
  favicon: assets/img/celldega_logo_32x32_transparent.png
  logo: assets/img/Celldega_LOGO_Two-Color_Transparent_Logo Mark.png
  # logo: assets/img/assets/img/celldega_logo_32x32_transparent.png
  # Theme overrides: overrides/.icons holds the Lucide outline GitHub icon.
  custom_dir: overrides
  icon:
    repo: lucide/github
  features:
    - navigation.indexes
    - content.code.copy

extra:
  social:
    - icon: "fontawesome/brands/github"
      link: "https://github.com/broadinstitute/celldega"
    - icon: "fontawesome/brands/bluesky"
      link: "https://bsky.app/profile/stp-broad.bsky.social"

