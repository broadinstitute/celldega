name: Test Python

on:
  workflow_call:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      # Set up specific Python version from matrix
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Set up Node.js and pnpm (required for full build)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      # Install package with development dependencies (full build with jupyter-builder)
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      # Run Python tests with coverage reporting
      - name: Run Python tests
        run: pytest --cov=src/celldega --cov-report=xml

      # Upload Python test coverage to Codecov (only for main Python version)
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: python
          name: codecov-python
          fail_ci_if_error: false
