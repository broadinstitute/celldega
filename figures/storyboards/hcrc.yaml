# Storyboard: Visium HD human colorectal cancer, told as a comic-style figure.
#
# Stage 1 (figures/tools/capture.py) renders each panel's `widget` with its `view`,
# `changes` and `actions` (clicks); stage 2 (figures/tools/compose.py) lays out the
# text below around the captures. Text can use facts from
# figures/build/hcrc/data/facts.json, e.g. {n_cells:,}; panel values can name them,
# e.g. facts.plasma.cells. Views name `views` below or facts["views"] entries.
#
# Text layers: per row a title (the figure legend carries the story); per panel
# a title (above the frame, or on it with `title_inside` / a row's
# `titles_inside`), an action bubble, an insight box and a color key (`legend`).
# A row's `layout` nests `row` (side by side) and `col` (stacked) groups of panel
# ids; `boxes` (drawn `over` a panel) outline where a zoomed panel looks and
# `links` draw arrows. The caption carries methods, statistics and reopen links.

id: hcrc
technology: Visium-HD
base_url: https://raw.githubusercontent.com/SharkieJones/celldega_Visium-HD_hCRC/refs/heads/main/Visium_HD_Human_Colon_Cancer_2025-10-25_2um

# Regions framed by panels, as boxes in data coordinates [x0, y0, x1, y1] (DegaFiles
# cell coordinates), or cameras {target, zoom}.
views:
  tissue: {box: [40600, 0, 65200, 22700], pad: 0.03}
  normal: {box: [53500, 11000, 60000, 22700], pad: 0.0}
  tls: {target: [63554, 11259], zoom: -2.9}
  crypts: {target: [57500, 15500], zoom: -2.15}
  fronds: {target: [63730, 9300], zoom: -2.45}
  tumor_wide: {target: [52991, 11646], zoom: -6.15}

# Cell types, as annotated on the Clustergram's columns (a manual category) and
# shown by the Landscape's zooms (the ▾ beside CELL).
cell_types: &cell_types
  values: {"0": Cancer, "2": Cancer, "3": Cancer, "8": Cancer, "10": Cancer,
           "4": Epithelium, "1": Myeloid, "5": IgA plasma, "9": IgG plasma,
           "14": IgG plasma, "13": Neutrophil, "6": Fibroblast, "7": Endothelial,
           "12": Muscle, "11": Low quality}
  colors: {Cancer: "#8c8c8c", Epithelium: "#9b4fd0", Myeloid: "#ff7f0e",
           IgA plasma: "#8c564b", IgG plasma: "#6baed6", Neutrophil: "#c5b0d5",
           Fibroblast: "#e377c2", Endothelial: "#bcbd22", Muscle: "#ff9896",
           Low quality: "#d3d3d3"}

# Names in the color keys, per label set.
names:
  leiden:
    "0": "0 cancer"
    "1": "1 myeloid"
    "2": "2 cancer"
    "3": "3 cancer"
    "4": "4 normal epithelium"
    "5": "5 IgA plasma"
    "6": "6 fibroblast"
    "7": "7 endothelial"
    "8": "8 cancer"
    "9": "9 IgG plasma"
    "10": "10 cancer"
    "11": "11 low quality"
    "12": "12 smooth muscle"
    "13": "13 neutrophil"
    "14": "14 IgG plasma"

rows:
  - id: a
    title: Linked visualizations
    layout:
      row:
        - col: [a1, {row: [a4, a5]}]
        - col:
            - a2
            - row: [m1, m2, m3, m4]
              insight: "Top 5 markers per cluster (DIM), labeled by cell type; blue: goblet-cell genes from Enrich"
          gap: 32
        - col: [a3, a6]
    boxes:
      - {over: a1, view_of: a4}
      - {over: a1, view_of: a5}
    links:
      - {from: {panel: a1, box: a4}, to: a4}
      - {from: {panel: a1, box: a5}, to: a5}
      - {from: {panel: a2, trapezoid: m1}, to: m1, route: straight}
      - {from: {panel: a2, trapezoid: m2}, to: m2, route: straight}
      - {from: {panel: a2, trapezoid: m3}, to: m3, route: straight}
      - {from: {panel: a2, trapezoid: m4}, to: m4, route: straight}
      - {from: {panel: a2, cell: [MUC2, "4"], edge: right}, to: {panel: a6, side: left}, route: elbow}
      - {from: {bubble: slice}, to: {panel: a2, trapezoid: m1}, bend: -1}
      - {from: {panel: a2, col: "9"}, to: {panel: a2e, side: top}}
    insets:
      - {panel: a2e, over: a2, x: 50, y: 30, width: 46}
    panels:
      - id: a1
        title: Landscape
        title_inside: top-right
        widget: landscape
        labels: leiden
        view: tissue
        size: [600, 540]
        shot: widget
        action: "Zoom and pan into regions of interest"
        bubble: {x: 3, y: 18}
        insight: "{n_clusters} Leiden clusters on the H&E image"
      - id: a2
        title: Clustergram
        title_inside: top-right
        widget: clustergram
        matrix: matrix.zarr
        rank_dim: 5
        size: [540, 720]
        linked_to: a3
        focused_gene: MUC2
        highlighted_cols: ["4"]
        changes: {dendrogram: {col: 25}}
        manual_cat:
          col:
            cell type: *cell_types
        shot: widget
        action: "Zoom, pan, reorder, identify clusters, annotate"
        bubble: {x: 65, y: 4.6, tail: false}
        bubbles:
          - {text: "Slice the dendrogram", x: 14, y: 82, tail: false, id: slice}
      - id: a2e
        widget: clustergram
        matrix: matrix.zarr
        rank_dim: 5
        size: [540, 720]
        manual_cat:
          col:
            cell type: *cell_types
        actions:
          - {click_cat: "9", wait: 1200}
          - {mark_dialog: "Manual category"}
        shot: dialog
        action: "Click a cluster's attribute, type a label"
      - id: a3
        title: Enrich
        title_inside: top-right
        widget: enrich
        genes: cluster_4_markers
        library: CellMarker_2024
        size: [330, 560]
        shot: widget
        actions:
          - {click_text: "Goblet Cell Colon Human", within: "svg text", mark: term, wait: 2000}
          - {click_text: "^MUC2,", regex: true, within: "span", mark: gene, wait: 4500}
        action: "Click a term"
        bubble: {mark: term, dx: 30}
        bubbles:
          - {text: "Click MUC2", mark: gene, side: above, dx: -2}
          - {text: "Full name and description from UniProt", x: 24, y: 63}
        insight: "Goblet cells top the list; the term's genes turn blue, MUC2 described"
      - id: a4
        title: Immune aggregate
        widget: landscape
        labels: leiden
        label_set: {name: cell type, <<: *cell_types}
        view: tls
        changes: {layers: {transcripts: false}}
        size: [440, 300]
        max_tiles_to_view: 400
        shot: widget
        insight: "The bars recount the cell types and genes in view"
      - id: a5
        title: Colon crypts
        widget: landscape
        labels: leiden
        label_set: {name: cell type, <<: *cell_types}
        view: crypts
        size: [440, 300]
        max_tiles_to_view: 200
        shot: widget
        insight: "Crypts cut across, IgA plasma cells between them"
      - id: m1
        title: Tumor
        widget: landscape
        labels: leiden
        view: tissue
        changes: {clusters: ["3", "0", "8", "10", "2", "11"], layers: {image: false}}
        size: [300, 278]
      - id: m2
        title: Epithelium
        widget: landscape
        labels: leiden
        view: tissue
        changes: {clusters: ["4"], layers: {image: false}}
        size: [300, 278]
      - id: m3
        title: Stroma
        widget: landscape
        labels: leiden
        view: tissue
        changes: {clusters: ["7", "6", "12"], layers: {image: false}}
        size: [300, 278]
      - id: m4
        title: Plasma
        widget: landscape
        labels: leiden
        view: tissue
        changes: {clusters: ["14", "9", "5"], layers: {image: false}}
        size: [300, 278]
      - id: a6
        title: Yearbook
        widget: yearbook
        labels: leiden
        actions:
          - {type: "4", within: "xpath=//*[normalize-space(text())='Cluster:']/following-sibling::input[1]"}
          - {type: MUC2, within: "xpath=//*[normalize-space(text())='Gene:']/following-sibling::input[1]"}
          - {click_button: Query, wait: 5000}
          - {type: "MUC2, TFF3", within: "input[placeholder='Gene search']", press: Enter, wait: 6000}
        num_rows: 2
        num_cols: 4
        portrait_size_um: 28
        microns_per_pixel: facts.microns_per_pixel
        size: [720, 458]
        shot: widget
        insight: "Query: cluster 4's cells with the most MUC2, which are goblet cells"
        title_inside: true

  - id: b
    title: Sub-clustering the normal epithelium
    layout:
      row:
        - {col: [b0, btools], gap: 44, margin_right: 30}
        - b1
        - {row: [b2], margin_right: 64}
        - row: [b3, b4, b5, b6, b7]
          legend: {keys: expression}
          margin_top: 52
    links:
      - {from: {panel: b0, side: bottom}, to: btools, route: straight}
      - {from: {panel: btools, side: right}, to: {panel: b1, side: left}, route: square}
      - {from: b3, to: {panel: b2, row: LGR5}, route: lane, head: start}
      - {from: b4, to: {panel: b2, row: TFF3}, route: lane, head: start}
      - {from: b5, to: {panel: b2, row: CA2}, route: lane, head: start}
      - {from: b6, to: {panel: b2, row: CA1}, route: lane, head: start}
      - {from: b7, to: {panel: b2, row: GUCA2A}, route: lane, head: start}
    panels:
      - id: b0
        title: Cluster 4
        copy_of: m2
        title_inside: true
      - id: btools
        static:
          images: [assets/jupyter.svg, assets/scanpy.png]
          caption: "Sub-cluster with Scanpy in a Jupyter notebook"
        aspect: 0.62
      - id: b1
        title: Sub-clusters
        widget: landscape
        labels: crypt_depth
        view: normal
        size: [250, 420]
      - id: b2
        title: By crypt depth
        widget: clustergram
        matrix: matrix_crypt.zarr
        size: [430, 560]
        changes: {order: {row: ini, col: ini}}
        insight: "Click a gene to map it; base to surface runs bottom left to top right"
      - id: b3
        title: LGR5
        widget: landscape
        labels: leiden
        view: normal
        changes: {genes: ["LGR5"], layers: {image: false}}
        size: [190, 420]
        insight: "Crypt bases"
      - id: b4
        title: TFF3
        widget: landscape
        labels: leiden
        view: normal
        changes: {genes: ["TFF3"], layers: {image: false}}
        size: [190, 420]
        insight: "Goblet cells"
      - id: b5
        title: CA2
        widget: landscape
        labels: leiden
        view: normal
        changes: {genes: ["CA2"], layers: {image: false}}
        size: [190, 420]
        insight: "Mid to upper"
      - id: b6
        title: CA1
        widget: landscape
        labels: leiden
        view: normal
        changes: {genes: ["CA1"], layers: {image: false}}
        size: [190, 420]
        insight: "Upper crypt"
      - id: b7
        title: GUCA2A
        widget: landscape
        labels: leiden
        view: normal
        changes: {genes: ["GUCA2A"], layers: {image: false}}
        size: [190, 420]
        insight: "Surface"

  - id: c
    title: Cancer sub-clusters
    titles_inside: true
    layout:
      row:
        - row: [c1, c2]
          legend:
            title: "Tumor frond"
            labels: leiden
            keys: ["8", "0", "3", "10", "1", "13"]
            names: {"8": "8 hypoxic", "0": "0 proliferative", "3": "3 proliferative", "10": "10 Wnt-high"}
        - c3
        - col: [c4, c4b]
        - c5
    boxes:
      - {over: c1, rows_of: c2}
      - {over: c3, view_of: c4}
    links:
      - {from: {panel: c1, box: c2, side: right}, to: {panel: c2, side: left}, route: square}
      - {from: {panel: c2, row: NDRG1}, to: {panel: c4b, side: left}, route: under}
      - {from: {panel: c3, box: c4, side: right}, to: {panel: c4, side: left}, route: side}
    panels:
      - id: c1
        title: Clustergram
        widget: clustergram
        matrix: matrix_cancer.zarr
        rank_dim: 25
        size: [470, 640]
        shot: widget
        actions:
          - {dblclick_col: "8 hypoxic", wait: 2500}
        action: "Reorder and zoom into the Clustergram"
        bubble: {box: c2, dx: 2}
        insight: "Top 25 markers per cluster, reordered by cluster 8"
      - id: c2
        title: Zoom in
        widget: clustergram
        matrix: matrix_cancer.zarr
        rank_dim: 25
        size: [400, 560]
        actions:
          - {dblclick_col: "8 hypoxic", wait: 2500}
          - {zoom_rows: 36}
          - {bold_gene: NDRG1}
        insight: "Hypoxia and inflammation genes on top"
      - id: c3
        title: Cancer subtypes
        widget: landscape
        labels: cancer_meta
        view: tumor_wide
        changes: {layers: {image: false}}
        size: [400, 420]
        legend: all
        insight: "Cluster 8 at the luminal tips of the glands"
      - id: c4
        title: A tumor frond
        widget: landscape
        labels: leiden
        view: fronds
        changes: {sliders: {cell: 100}}
        size: [560, 300]
        max_tiles_to_view: 4
        insight: "Cluster 8 at the frond's tip; immune cells in its core"
      - id: c4b
        title: NDRG1
        widget: landscape
        labels: leiden
        view: fronds
        changes: {genes: ["NDRG1"], layers: {image: false}, sliders: {cell: 100}}
        size: [560, 300]
        max_tiles_to_view: 4
        insight: "NDRG1 (darker red = more) crowds the frond's tip"
      - id: c5
        title: Enrich
        title_inside: top-right
        widget: enrich
        genes: cluster_8_markers
        library: MSigDB_Hallmark_2020
        size: [330, 560]
        shot: widget
        actions:
          - {click_text: "Hypoxia", within: "svg text", mark: term, wait: 1500}
          - {click_text: "^NDRG1,", regex: true, within: "span", wait: 4500}
        insight: "Cluster 8's markers: hypoxia, TNF-alpha via NF-kB"

caption: |
  **Figure (draft). A Visium HD human colorectal cancer section explored with
  Celldega.** 10x Genomics Visium HD (2 um bins, segmented into cells): {n_cells:,}
  cells in {n_clusters} Leiden clusters (crc_cluster.h5ad on Hugging Face,
  broadinstitute/Celldega_Supporting_Data; DegaFiles on GitHub,
  SharkieJones/celldega_Visium-HD_hCRC). (a) Landscape: H&E with cells colored by
  Leiden cluster (colors as in the Clustergram's column strip); zooms on the densest immune region and on normal crypts, with the
  control panel's cluster and gene bar charts counting the cells in view.
  Clustergram: pseudo-bulk signature of each cluster (log1p counts per million,
  z-scored per gene; red above and blue below the cluster mean; dot size: fraction
  of cells expressing), top 5 ranked markers per cluster (t-test); columns labeled by
  cell type (a manual category, typed into the Clustergram's category form shown
  as a pop-out); column dendrogram cut at a quarter of its height, and four of its
  groups highlighted on the tissue. The zooms show cells, and count the control
  panel's bars, by those cell types (the menu beside CELL); cell outlines load in
  close-up (transcripts hidden in the immune aggregate). Enrich: enrichment of cluster 4's top 25 ranked
  markers in the CellMarker 2024 library (computed with Enrichr), the goblet-cell
  term selected (its genes blue in the Clustergram) and MUC2 clicked (bold, with
  its UniProt description).
  Yearbook: the eight cluster-4 cells with the most MUC2, from the Yearbook's own
  query (cluster 4, gene MUC2), with MUC2 and TFF3 typed into its gene search;
  28 um portraits. (b) Cluster 4 sub-clustered with Scanpy in a Jupyter notebook
  (Leiden; two small sub-clusters excluded), sub-clusters ordered by crypt depth
  from their marker genes, colored as in the crypt Clustergram's column strip (logos: Project Jupyter, scverse/Scanpy).
  Clustergram: mean log-normalized expression z-scored per gene; rows are each
  sub-cluster's top 4 markers plus the mapped genes, placed by the sub-cluster where
  they peak. Genes colored by expression in the normal epithelium (cells without the
  gene are not drawn). (c) The cancer clusters (0, 2, 3, 8, 10) re-analyzed alone:
  mean expression z-scored across them, markers ranked among them (t-test), top 25
  per cluster, rows ranked by cluster 8 (double-click on its label), then zoomed
  to NDRG1. A tumor frond: cells colored by Leiden cluster on the H&E, and the same
  view with cells colored by NDRG1 expression.
  Subtypes: cluster 8 (hypoxia and inflammation genes), clusters 0 and 3 (the most
  proliferation genes: MKI67 in 34% and 30% of cells, TOP2A in 21% and 26%, against
  at most 22% and 15% elsewhere) and clusters 2 and 10 (LGR5 in 39% of cluster 2;
  Wnt targets AXIN2, NKD1 and APCDD1 highest in cluster 10). Hypoxia genes in
  cluster 8 against the other four: NDRG1 43% (at most 18%), SLC2A1 33% (14%),
  DDIT4 24% (8%), ERO1A 57% (37%), VEGFA 66% (52%). Enrich: cluster 8's top 50
  ranked markers in the MSigDB Hallmark 2020 library, the hypoxia term selected and
  NDRG1 clicked (its UniProt description). Every panel is a Celldega
  render of the data (figures/tools/capture.py), laid out by
  figures/tools/compose.py from figures/storyboards/hcrc.yaml.
