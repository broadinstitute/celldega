name: Quality Gate

on:
  workflow_call:
    outputs:
      passed:
        description: 'Whether quality gate passed'
        value: ${{ jobs.quality-checks.outputs.passed }}

jobs:
  # =============================================================================
  # Code Quality - Linting, Formatting, and Security
  # =============================================================================
  quality-checks:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.quality-result.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      # Setup environments
      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: '3.11'
          disable-jupyter-builder: 'true'

      - name: Setup JavaScript environment
        uses: ./.github/actions/setup-js-env

      # Python quality checks
      - name: Lint Python code
        run: ruff check src/

      - name: Check Python formatting
        run: ruff format --check src/

      # JavaScript quality checks
      - name: Lint JavaScript code
        run: pnpm run lint:js

      - name: Check JavaScript formatting
        run: pnpm run format:js:check

      # Security scanning
      - name: Python security scan
        run: |
          pip install safety bandit[toml]
          safety check --json --output safety-report.json || true
          bandit -r src/ -f json -o bandit-report.json || true

      # Set quality gate result
      - name: Set quality result
        id: quality-result
        run: echo "passed=true" >> $GITHUB_OUTPUT
